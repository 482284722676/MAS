<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仪表盘 - MAS 管理后台</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/" class="navbar-brand">MAS<span>管理后台</span></a>
  </div>
</nav>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-title">导航</div>
    <a href="/admin/dashboard.html" class="active">仪表盘</a>
    <a href="/admin/manage.html">档案管理</a>
    <a href="/admin/review.html">档案审核</a>
    <a href="/admin/suggestions.html">意见建议</a>
    <a href="/" target="_blank" style="margin-top:auto;">返回前台</a>
  </aside>

  <main class="admin-content">
    <div class="admin-header">
      <h1>仪表盘</h1>
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn btn-sm" id="changePwdBtn" style="display:none;" onclick="showChangePwd()">自定义密码</button>
        <button class="admin-logout" onclick="logout()">退出登录</button>
      </div>
    </div>

    <div class="stats-grid" id="statsGrid">
      <div class="loading">加载中...</div>
    </div>

    <div style="margin-top:32px;" id="securityCard">
      <div class="detail-block" style="background:var(--bg-card);border:1px solid var(--border-color);padding:24px;">
        <h2 style="margin-bottom:16px;">安全设置</h2>
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">
          <div>
            <p style="font-family:var(--font-mono);font-size:14px;color:var(--text-primary);">管理员密码</p>
            <p id="pwdStatus" style="font-size:12px;color:var(--text-muted);margin-top:4px;">检测中...</p>
          </div>
          <button class="btn" id="changePwdBtn" style="display:none;" onclick="showChangePwd()">修改密码（仅一次）</button>
          <span id="pwdChangedBadge" style="display:none;font-family:var(--font-mono);font-size:11px;color:var(--safe);padding:6px 12px;border:1px solid var(--safe);">已自定义</span>
        </div>
      </div>
    </div>

    <div id="changePwdOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center;">
      <div style="background:var(--bg-card);border:1px solid var(--border-accent);padding:40px;max-width:420px;width:90%;text-align:center;">
        <h3 style="font-family:var(--font-mono);font-size:16px;letter-spacing:2px;margin-bottom:8px;">修改管理员密码</h3>
        <p style="font-size:12px;color:var(--text-muted);margin-bottom:24px;">此操作仅可执行一次，修改后该按钮将永久消失</p>
        <div class="form-group" style="text-align:left;">
          <label>新密码</label>
          <input type="password" id="newPassword" placeholder="输入新密码（至少4位）" style="width:100%;">
        </div>
        <div class="form-group" style="text-align:left;">
          <label>确认新密码</label>
          <input type="password" id="confirmPassword" placeholder="再次输入新密码" style="width:100%;">
        </div>
        <div class="login-error" id="pwdError" style="display:none;margin-bottom:16px;"></div>
        <div style="display:flex;gap:12px;justify-content:center;">
          <button class="btn btn-primary btn-sm" onclick="submitChangePwd()">确认修改</button>
          <button class="btn btn-sm" onclick="hideChangePwd()">取消</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/js/particles.js"></script>
<script src="/js/api.js"></script>
<script>
(function() {
  const token = localStorage.getItem('mas_token');
  if (!token) { window.location.href = '/admin/login.html'; return; }

  verifyToken().catch(() => { window.location.href = '/admin/login.html'; });

  window.logout = function() {
    localStorage.removeItem('mas_token');
    window.location.href = '/admin/login.html';
  };

  window.showChangePwd = function() {
    document.getElementById('newPassword').value = '';
    document.getElementById('confirmPassword').value = '';
    document.getElementById('pwdError').style.display = 'none';
    document.getElementById('changePwdOverlay').style.display = 'flex';
  };

  window.hideChangePwd = function() {
    document.getElementById('changePwdOverlay').style.display = 'none';
  };

  window.submitChangePwd = function() {
    var pwd = document.getElementById('newPassword').value;
    var confirm = document.getElementById('confirmPassword').value;
    var errDiv = document.getElementById('pwdError');

    if (!pwd || pwd.length < 4) {
      errDiv.textContent = '密码长度不能少于4位';
      errDiv.style.display = 'block';
      return;
    }
    if (pwd !== confirm) {
      errDiv.textContent = '两次输入的密码不一致';
      errDiv.style.display = 'block';
      return;
    }

    changePassword(pwd).then(function() {
      showToast('密码修改成功，请使用新密码重新登录');
      hideChangePwd();
      document.getElementById('changePwdBtn').style.display = 'none';
      document.getElementById('pwdChangedBadge').style.display = 'inline-block';
      document.getElementById('pwdStatus').textContent = '密码已自定义修改';
      document.getElementById('pwdStatus').style.color = 'var(--safe)';
      setTimeout(function() { logout(); }, 1500);
    }).catch(function(err) {
      errDiv.textContent = err.message;
      errDiv.style.display = 'block';
    });
  };

  getAuthStatus().then(function(data) {
    var statusEl = document.getElementById('pwdStatus');
    var btnEl = document.getElementById('changePwdBtn');
    var badgeEl = document.getElementById('pwdChangedBadge');
    if (!data.passwordChanged) {
      statusEl.textContent = '默认密码，建议立即修改';
      statusEl.style.color = 'var(--euclid)';
      btnEl.style.display = 'inline-block';
    } else {
      statusEl.textContent = '密码已自定义修改';
      statusEl.style.color = 'var(--safe)';
      badgeEl.style.display = 'inline-block';
    }
  }).catch(function() {});

  getStats().then(data => {
    const grid = document.getElementById('statsGrid');
    let html = `<div class="stat-card total">
      <div class="stat-value">${data.total}</div>
      <div class="stat-label">档案总数</div>
    </div>`;

    const classColors = {
      'Safe': 'var(--safe)', 'Euclid': 'var(--euclid)', 'Keter': 'var(--keter)',
      'Thaumiel': 'var(--thaumiel)', 'Apollyon': 'var(--apollyon)', 'Neutralized': 'var(--neutralized)'
    };

    data.byClass.forEach(item => {
      html += `<div class="stat-card" style="border-left:3px solid ${classColors[item.class] || 'var(--accent)'};">
        <div class="stat-value" style="color:${classColors[item.class] || 'var(--accent)'};">${item.count}</div>
        <div class="stat-label">${item.class}</div>
      </div>`;
    });
    grid.innerHTML = html;
  }).catch(err => {
    document.getElementById('statsGrid').innerHTML = `<div class="empty">加载失败: ${err.message}</div>`;
  });
})();
</script>
</body>
</html>
