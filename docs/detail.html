<script>
(function() {
  document.getElementById('navbarToggle').addEventListener('click', function() {
    this.classList.toggle('open');
    document.getElementById('navbarLinks').classList.toggle('open');
  });
})();
(function() {
  var urlParams = new URLSearchParams(window.location.search);
  var id = urlParams.get('id');

  if (!id) {
    document.getElementById('detailContainer').innerHTML = '<div class="empty">未指定项目编号</div>';
    return;
  }

  getAnomaly(id).then(function(item) {
    document.title = item.item_number + ' - ' + item.title;
    document.getElementById('pageTitle').textContent = item.item_number + ' - ' + item.title;

    document.getElementById('detailContainer').innerHTML =
      '<div class="detail-header">' +
        '<a href="anomalies.html" class="back-link">&larr; 返回档案列表</a>' +
        '<div class="detail-meta">' +
          '<span class="detail-id">' + item.item_number + '</span>' +
          '<span class="class-badge ' + item.class + '">' + item.class + '</span>' +
        '</div>' +
        '<h1 class="detail-title">' + item.title + '</h1>' +
      '</div>' +
      '<div class="detail-divider"></div>' +
      '<div class="detail-block">' +
        '<h2>特殊收容措施</h2>' +
        '<p>' + item.containment_procedures + '</p>' +
      '</div>' +
      '<div class="detail-block">' +
        '<h2>描述</h2>' +
        '<p>' + item.description + '</p>' +
      '</div>' +
      '<div class="detail-divider"></div>' +
      '<p style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);letter-spacing:1px;">' +
        '创建时间：' + formatDate(item.created_at) + '<br>' +
        '最后更新：' + formatDate(item.updated_at) +
      '</p>';
  }).catch(function(err) {
    document.getElementById('detailContainer').innerHTML =
      '<div class="empty">' + (err.message || '加载失败') + '</div>';
  });
})();
</script>
