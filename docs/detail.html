var MAS_DETAILS = {
  "1":{"id":1,"item_number":"MAS-001","title":"遗忘之钟","class":"Safe","description":"MAS-001 是一台外观为19世纪英国制造的立式摆钟，高约2.1米，外壳由橡木制成。该钟的异常效应表现在：任何在钟声响起时位于其半径5米范围内的人类个体，将永久遗忘过去24小时内发生的全部事件。该效应不可逆，且对被影响者的长期记忆无损害。\n\n实验表明，使用耳塞或隔音设备可完全阻止该效应。钟声频率为440Hz，每次整点敲击持续3-5秒。\n\n当前该钟被置于Site-17的低安保收容间内，由隔音材料包裹。","containment_procedures":"MAS-001 须始终存放于标准隔音收容间内。收容间墙壁、天花板和地板须覆盖厚度不低于10cm的隔音泡沫材料。\n\n任何进入收容间的人员必须佩戴工业级降噪耳罩（NRR ≥ 30dB）。每月须进行一次声学密封性检查。\n\n未经2级及以上安全许可，严禁移除隔音罩。任何试图在非测试环境下聆听钟声的行为将受到纪律处分。","created_at":"2026-07-01T00:00:00Z","updated_at":"2026-07-01T00:00:00Z"},
  "2":{"id":2,"item_number":"MAS-002","title":"无限回廊","class":"Euclid","description":"MAS-002 是位于██市██区一栋废弃办公楼三楼的一条走廊，全长12.7米。异常表现为：当有意识的人类个体从走廊一端走向另一端时，行进距离将呈指数级增长，但走廊的外观长度保持不变。\n\n测试 D-2847 在走廊中行进了约3.7公里后失去意识，在此之前报告称”走廊似乎越来越长“。GPS追踪显示该人员在物理空间中的位移不超过3米。\n\n值得注意的是，只有当个体意识到自身正在穿越走廊时异常效应才会触发。闭眼行走、被他人推着经过，或在无意识状态下通过该走廊不会触发异常。\n\n目前已知最长生存记录为D-9981，在走廊中行进了约4.2小时后力竭倒下，后方救援人员在7秒内将其从走廊中拉出。","containment_procedures":"MAS-002 所在的建筑已由协会前台公司”████地产“购买并封锁。建筑外围设有2.5米高围栏及监控摄像头。\n\n走廊两端安装有钢制安全门，由两名安保人员24小时轮班看守。所有进入建筑的人员须签署知情同意书，明确了解异常效应的触发条件。\n\n禁止在走廊附近进行任何形式的方向感引导或空间感知测试。紧急情况下可释放催眠气体使受影响者失去意识后实施救援。","created_at":"2026-07-02T00:00:00Z","updated_at":"2026-07-02T00:00:00Z"},
  "3":{"id":3,"item_number":"MAS-003","title":"墨色之书","class":"Keter","description":"MAS-003 是一本尺寸为23×15×4cm的精装书籍，封面为黑色皮革，无任何标题或文字。书页材质为未知的类羊皮纸材料，共计 ███ 页。\n\n当任何人类个体打开该书并注视任一页面超过3秒，该页面将自动以阅读者的母语显示一段预言性文字。预言内容必然在72小时内以某种形式应验，概率为████。\n\n截至目前，所有记录的预言均已应验，包括但不限于：自然灾害（████）、政治事件（████）、以及个别协会人员的死亡。\n\n██/██/████，该书的某一页被观测到仅显示一行文字：”[数据删除]“。该次事件后，O5议会投票决定将MAS-003的安保等级提升至Keter。\n\n实验记录表明，使用机械装置翻页并远程拍摄不会触发异常效应。","containment_procedures":"MAS-003 须存放于Site-01的高安保保险库内，保险库由30cm厚钛合金门保护，需要两名4级人员的生物特征同时验证方可开启。\n\n任何情况下禁止人类目光直接接触书页超过3秒。所有观测必须通过数字摄像设备进行，并延迟至少5秒传输图像。\n\n每72小时由指定的D级人员进行一次强制阅读测试，以验证异常效应是否持续。测试后D级人员须被隔离观察72小时。\n\n若发现末日级预言，须立即启动协议”终末之书“，通知O5议会全体成员。","created_at":"2026-07-03T00:00:00Z","updated_at":"2026-07-03T00:00:00Z"},
  "4":{"id":4,"item_number":"MAS-004","title":"安抚之石","class":"Thaumiel","description":"MAS-004 是一块表面光滑的椭圆形黑曜石，重约3.7kg，长约28cm。当被置于任何具有破坏性异常效应的项目附近（有效范围约50米），该异常效应的活跃度将显著下降。\n\n定量测试表明，MAS-004可将异常效应强度降低约60%-85%，具体取决于目标异常项目的等级。\n\nMAS-004 已被成功应用于收容 MAS-███、MAS-███ 和 MAS-███ 的收容措施中，显著降低了这些项目的收容难度和资源消耗。\n\nMAS-004 自身的异常效应来源不明。光谱分析显示其材质为普通黑曜石，无任何异常化学成分。当前理论认为其效应源于某种未知的能量场辐射。\n\n值得注意的是，MAS-004 对 Keter 级及以上异常项目的压制效果存在递减趋势。对两个以上项目同时使用时效果会分散。","containment_procedures":"MAS-004 须存放于独立的收容柜中，仅在获得Site主管和至少一名O5议员授权后方可调出使用。\n\n每次使用后须进行为期不少于24小时的”冷却“观察期。在此期间须监控是否有被压制项目的异常效应出现反弹。\n\nMAS-004 的使用优先级由O5议会每季度审核一次。当前优先序为：MAS-003 &gt; MAS-███ &gt; MAS-███。\n\n非紧急情况下，严禁将MAS-004同时应用于超过两个目标项目。","created_at":"2026-07-04T00:00:00Z","updated_at":"2026-07-04T00:00:00Z"},
  "5":{"id":5,"item_number":"MAS-005","title":"镜中之人","class":"Euclid","description":"MAS-005 是一个存在于所有平面镜中的类人实体。该实体通常表现为一个模糊的、性别不明的深色轮廓，在反射面的边缘隐约可见。\n\n当人类个体在夜间独处（即6米范围内无其他意识个体）对着镜子凝视超过15秒时，该实体将逐渐显现为清晰的人形，并尝试与凝视者进行模拟对话——但仅能重复凝视者此前说过的语句。\n\n截至目前，██ 例记录显示该实体在某些情况下会说出凝视者从未说过的话，且这些话在后续3-14天内会在现实中以某种形式出现。相关案例已被归档至[附录MAS-005-B]。\n\nMAS-005 似乎存在于所有反射面中，包括水面、玻璃窗和抛光金属。打破镜子仅能暂时驱离该实体（约6-12小时），之后该实体会在另一反射面中出现。\n\n与MAS-005的互动不会造成直接物理伤害，但██%的长期互动对象报告出现失眠、镜像恐惧症（eisoptrophobia）和轻度偏执症状。","containment_procedures":"所有Site-17的居住区域和公共区域的镜面须在每日20:00至次日06:00期间用不透明布料遮盖。\n\n个人卫生间的镜子须安装可锁定盖板，夜间由居住者自行锁闭。安保巡逻人员须在夜间巡查时确认所有镜面遮盖措施已正确实施。\n\n禁止在夜间进行任何涉及MAS-005的实验。实验须在白天进行，且有至少两名研究人员在场。\n\n任何人员若报告在镜中看到异常轮廓，须立即向心理健康部门报告并接受心理评估。","created_at":"2026-07-05T00:00:00Z","updated_at":"2026-07-05T00:00:00Z"},
  "6":{"id":6,"item_number":"MAS-006","title":"终灭之种","class":"Apollyon","description":"MAS-006 是一粒外观为普通蒲公英种子的微观实体，直径约1.2mm。\n\n当该种子与任意有机物质接触超过0.3秒，将立即触发不可逆的分解反应：接触点周围的所有有机分子将以指数级速率分解为基本元素。该效应的传播速率约为每秒3.7米（固体有机材料）或每秒14米（液体有机材料）。\n\n████/██/██ 的首次实验中，该种子在接触实验用小鼠后，在 ██ 秒内将整个实验楼层的全部有机物质分解，造成 ██ 名研究人员死亡。\n\n计算模型显示，若MAS-006接触地球表面，理论上可在 ██ 小时内将地球生物圈的全部有机物质分解殆尽。\n\n当前无已知方法可逆转该分解效应。","containment_procedures":"MAS-006 须永久存放于Site-██的地下██层的高真空无机收容舱内。收容舱完全由高纯度硅酸盐玻璃和钛合金构成，内部不含任何有机材料。\n\n收容舱须维持至少10⁻⁶ Torr 的真空度。每15分钟自动检测一次真空度和舱体完整性。\n\n进入收容区域的人员须穿戴全封闭无机防护服，且在进入前须经过有机物残留扫描。任何含有机材料的物品严禁带入收容区域。\n\n收容舱由独立的钚-238同位素电池供电，确保在市电中断后可持续运行至少50年。\n\n若收容舱完整性受到威胁，须立即启动协议”虚无之日“，通知O5议会并激活Site自毁程序。","created_at":"2026-07-06T00:00:00Z","updated_at":"2026-07-06T00:00:00Z"},
  "7":{"id":7,"item_number":"MAS-007","title":"重生之瓮","class":"Neutralized","description":"MAS-007 曾是一个高约45cm的赤陶瓮，据推断制造于公元前4世纪的古希腊地区。其异常效应为：将任何生物遗骸（包括骨灰）置入瓮中并密封24小时后，遗骸将重组为活的、完全健康的成年形态。\n\n██/██/19██，MAS-007在协会进行第██次测试期间，瓮体突然碎裂为数百片。效果当场消失。后续分析显示瓮的碎片已无任何异常特性。\n\n在被无效化前，MAS-007 共复活了 ██ 个生物体。其中人类复活体 █ 名，均已接受全面体检和心理评估。所有复活体在复活后均对瓮碎裂前的最后一段记忆存在约15分钟的缺失，其余认知功能正常。\n\n瓮的碎裂原因至今不明。当时未对瓮体施加超过常规标准的物理压力或化学接触。高速摄影录像显示瓮体是从内部向外碎裂的，但当时瓮中并无任何物体。\n\nMAS-007 的碎片目前保存于Site-17的考古异常物品仓库中，供后续研究使用。","containment_procedures":"MAS-007 已永久无效化。其碎片保存于Site-17第██仓库的标准考古储存箱中。\n\n对碎片的研究须在书面申请获批后进行。禁止将碎片拼合或进行可能恢复其功能的任何尝试。","created_at":"2026-07-07T00:00:00Z","updated_at":"2026-07-07T00:00:00Z"},
  "8":{"id":8,"item_number":"MAS-008","title":"虚空之井","class":"Keter","description":"MAS-008 是位于██沙漠深处的一口天然竖井，井口直径约3.2米，深度无法测量。所有投入井中的物体均未探测到触底信号，声呐探测在约██公里处失去回波。\n\n██/██/20██，一次遥控探测中，探测器在下降至██公里深度时传回了约0.3秒的音频信号，经分析后确认为████种不同语言的混响，其中包括三种已灭绝的古代语言。\n\n更令人不安的是，每次探测结束后24小时内，Site-██的通讯系统会短暂接收到来自井底的信号，内容为探测人员的姓名、出生日期以及一个精确到秒的死亡时间。截至目前，█名收到此类信号的探测人员中，████的死亡时间精确到秒。\n\n当前理论认为MAS-008可能连接着某个非欧几里得空间维度。","containment_procedures":"MAS-008 井口周围已建立半径为200米的军事禁区，由MAS武装安保部队24小时巡逻。井口上方安装有可伸缩钛合金盖板，非测试期间须保持密封状态。\n\n所有测试须在至少两名4级人员监督下进行。测试设备须通过线缆连接，严禁使用无线遥控设备（已有█起信号异常事件记录）。\n\n参与测试人员须提前签署知情同意书与免责声明。测试后须接受为期30天的隔离观察和每日心理评估。\n\n任何未经授权接近井口200米范围内的人员将被立即拘留并接受A级记忆删除。","created_at":"2026-07-08T00:00:00Z","updated_at":"2026-07-08T00:00:00Z"},
  "9":{"id":9,"item_number":"MAS-009","title":"影织者","class":"Euclid","description":"MAS-009 是一个类人实体，身高约1.8米，全身由极为致密的阴影物质构成。该实体无法在完全黑暗或完全明亮的环境中被目击——它仅存在于光影交界处，即半影区域。\n\nMAS-009 表现出中等智力水平，能够理解简单的口头指令，但似乎无法或不愿发声。它通过操控自身阴影形态来”书写“文字进行交流，书写内容通常为单个词语或短句。\n\n该实体的异常效应体现在：当它用阴影触手接触人类个体的影子时，可以在一定程度上影响该个体的情绪状态。实验表明这种影响是可逆的，持续时间约为2-6小时。\n\nMAS-009 于██/██/20██在██市一处废弃剧院中被发现。发现时该实体正”编织“着数十个已失踪人员的影子，这些影子被固定在一面墙壁上，呈现为舞者的姿态。\n\n值得注意的是，MAS-009 似乎对艺术家和创意工作者表现出特别的兴趣。","containment_procedures":"MAS-009 须收容于一个长宽高均为6米的特制收容间内。收容间一侧安装有可调亮度的LED照明系统，用于精确控制光照条件以维持该实体的可见性。\n\n收容间内须始终保持至少有一个产生半影区域的光源配置。光照系统由独立备用电源供电。\n\n所有与MAS-009的互动须通过收容间内的机械臂完成。人员不得在无防护情况下进入收容间。\n\n心理学部门每月须对MAS-009进行一次认知能力评估。提供给该实体的娱乐材料须经过审查，艺术类材料优先提供。","created_at":"2026-07-09T00:00:00Z","updated_at":"2026-07-09T00:00:00Z"},
  "10":{"id":10,"item_number":"MAS-010","title":"永恒风暴","class":"Apollyon","description":"MAS-010 是持续存在于木星大红斑核心区域的一个异常气象现象。观测数据表明，该风暴自至少███年前已存在于该位置，且其能量输出模式不符合任何已知的气象学模型。\n\n██/██/20██，深空探测器”守夜人“号在穿越木星轨道时意外接收到了来自MAS-010的规律性电磁脉冲。解密后的信号内容为一段不断循环的二进制信息，翻译后为：████████████。O5议会随后将MAS-010的等级从Keter上调至Apollyon。\n\n进一步分析表明，MAS-010的能量输出在过去██年内呈稳定增长趋势。若该趋势持续，预计在██年内将达到足以影响地球磁场的强度。\n\n当前所有阻止尝试均宣告失败。提案”行星屏障“和”太阳帆偏移“仍在理论阶段。","containment_procedures":"MAS-010 的物理收容在现有技术条件下无法实现。当前措施集中于信息管控和远程监测。\n\n所有关于MAS-010的观测数据须经过”天幕协议“过滤后方可对外发布。全球天文台的数据流中已植入延时与篡改算法。\n\n三颗监测卫星（代号”守夜人-2“至”守夜人-4“）保持在木星轨道持续监测。监测数据实时传输至Site-01。\n\n若检测到MAS-010出现不可控的能量释放，须立即启动协议”熄灯“，启动全球电磁屏蔽网络。","created_at":"2026-07-10T00:00:00Z","updated_at":"2026-07-10T00:00:00Z"},
  "11":{"id":11,"item_number":"MAS-011","title":"记忆之泉","class":"Safe","description":"MAS-011 是一处位于██山脉深处的天然温泉，泉水温度恒定在37.2°C（与人体正常体温相同）。\n\n当人类个体将头部浸入泉水并在水下睁开眼睛超过5秒后，该个体将获得一段不属于自己的完整记忆。记忆内容随机，来自历史上某个真实存在过的人类个体。体验者可以清晰回忆该段记忆的全部细节，包括视觉、听觉、嗅觉和触觉感受。\n\n截至目前，已记录的”借阅“记忆包括：一名14世纪法国农妇的婚礼日、一名19世纪日本武士的切腹仪式、一名二战期间德国飞行员的最后一次飞行、以及████████。\n\n每次浸泡获得的记忆是永久性的且不会覆盖体验者的原有记忆。但约有██%的体验者在获得记忆后报告出现短暂的身份混淆现象，通常在7-14天内自行缓解。\n\n泉水样本的化学分析未发现任何异常成分。其异常效应被认为来源于泉水所在的特定地理位置。","containment_procedures":"MAS-011 及周边500米范围已被划为自然保护区，由前台公司”██温泉度假村“运营。所有访客须在不知情的情况下接受引导，避免将头部浸入泉水中。\n\n实验性浸泡须经伦理委员会批准。每月最多进行3次测试。测试对象须提前接受心理评估，测试后须接受为期30天的跟踪观察。\n\n泉眼处安装有隐蔽的水下摄像头，24小时监控。安保人员以”救生员“身份驻守现场。\n\n获取的记忆内容须记录在案并归档至”记忆图书馆“数据库。","created_at":"2026-07-11T00:00:00Z","updated_at":"2026-07-11T00:00:00Z"},
  "12":{"id":12,"item_number":"MAS-012","title":"量子双子","class":"Thaumiel","description":"MAS-012 是一对完全相同的球体装置，每个直径约15cm，外壳由未知的银白色金属构成，表面无任何接缝或开口。两球体分别标记为MAS-012-A和MAS-012-B。\n\n其异常效应表现为：无论两球体之间的距离多远（已测试的最大距离为地球至月球的约38万公里），对其中一个球体施加的任何形式的能量输入（热、电、动能等）都会实时转化为等量的能量从另一个球体输出。\n\n基于此特性，MAS-012已被应用于多个项目中：\n- 为远程站点提供即时能源传输\n- 作为不可拦截的紧急通讯系统（摩尔斯电码式的能量脉冲）\n- 在MAS-███的收容中维持远程冷却系统\n\n值得注意的是，能量传输效率为惊人的████%，远超出当前理论物理学的预测极限。\n\n对球体材质的分析至今无结论。质谱分析显示该材料的原子序数不在当前已知元素周期表中。","containment_procedures":"MAS-012-A 固定存放于Site-01的能源中枢，连接至主电网和应急系统。\n\nMAS-012-B 存放于Site-17的高安保储存库中，仅在获得O5议会书面授权后方可调出部署。\n\n每次使用须记录能量输入/输出的精确数值。累计传输能量须控制在安全阈值（██兆焦耳）以内。\n\n球体连接状态须每6小时自动检测一次。若检测到连接中断，须立即通知Site主管。","created_at":"2026-07-12T00:00:00Z","updated_at":"2026-07-12T00:00:00Z"},
  "13":{"id":13,"item_number":"MAS-013","title":"反语者","class":"Euclid","description":"MAS-013 是一名外表约35岁的人类男性，自称”阿列夫“。该个体的异常效应体现在其语言能力上：MAS-013所说的每一句话，其语义都会在大约15分钟后以某种形式在现实中”兑现“其反义。\n\n例如：\n- MAS-013说”今天不会下雨“→ 15分钟后原本晴朗的天空突然出现局部暴雨\n- MAS-013说”你看起来很健康“→ 15分钟后该对象报告突发剧烈头痛\n- MAS-013说”这栋楼很安全“→ 15分钟后建筑内发生不明原因的电路火灾\n\n反向推断，该效应可以被有策略地利用。在一次实验中，MAS-013说”你明天一定会死“给一名D级人员，该人员至今已存活██天，超过所有同批次D级人员。\n\nMAS-013 于██/██/20██ 主动向协会自首。其动机不明，但在访谈中反复提到”厌倦了成为谎言的源头“。\n\n值得注意的是，MAS-013的书面文字和手语不受异常效应影响。","containment_procedures":"MAS-013 须收容于标准生活单元中，配备基本生活设施。该个体表现出高度合作态度，目前安保等级为2级。\n\n所有与该个体的口头交流须通过收容间内置的扬声器系统进行，交流内容须实时转写为文字备份。\n\nMAS-013 每天可使用书写板进行书面交流（不受异常效应影响）。鼓励该个体以书面方式表达需求。\n\n禁止在非测试环境中要求MAS-013发表关于协会、收容设施或人员安全的任何口头声明。\n\n每月进行一次心理评估。MAS-013的自首动机仍在调查中。","created_at":"2026-07-13T00:00:00Z","updated_at":"2026-07-13T00:00:00Z"},
  "14":{"id":14,"item_number":"MAS-014","title":"静滞之室","class":"Safe","description":"MAS-014 是位于Site-17地下三层的一个房间（编号B3-███），尺寸为4×5×3米。该房间内部的物理时间流逝速度为外界的约1/████。\n\n具体来说，在该房间内经过的每一秒，对应外界约██小时。一支点燃的蜡烛在房间内可持续燃烧数十年（外界时间），一杯热水在室温下可保持温度数月。\n\n该异常效应仅作用于房间内部。站在门口（物理上处于房间边界）不会触发效应。\n\n记录表明，该房间在Site-17建设之前已存在，建筑图纸上并未规划此房间。原始用途不明。墙壁材质为普通混凝土，与建筑其他部分一致。\n\n目前该房间被用作紧急避难所和时间敏感物品的保存场所。","containment_procedures":"MAS-014 的门须保持常闭状态。门旁安装有内外时间同步的数字时钟（一个显示内部时间，一个显示外部时间）。\n\n进入人员在门内侧须安装安全绳，绳的另一端固定在门外。每名人员的内部停留时间不得超过5分钟（内部时间）。\n\n该房间被指定为Site-17的紧急避难所。在站点遭受攻击或灾难时，关键人员可撤退至该房间等待救援。\n\n禁止在该房间内存放食物、水源以外的消耗品。房间内的物品清单须每月更新。","created_at":"2026-07-14T00:00:00Z","updated_at":"2026-07-14T00:00:00Z"},
  "15":{"id":15,"item_number":"MAS-015","title":"虚空放逐者","class":"Keter","description":"MAS-015 是一个不具确定形态的实体，当前假说认为它存在于可见光谱之外的某个维度中。该实体能够”选择性地抹除“三维空间中的物质——被其”选中“的物体或人体部位会瞬间消失，无任何能量释放或残留物。\n\n抹除过程被称为”放逐事件“。受影响区域呈现完美的球形空缺，直径从几毫米到██米不等。放逐事件的发生没有可预测的模式。\n\n██/██/20██，在██市市中心发生了一次直径约30米的放逐事件，导致一栋12层建筑的中心部分连同██名居民一同消失。事件后该建筑的残存结构完美环绕着球形空缺，截面光滑如镜。\n\n追踪”被放逐“物质的努力均告失败。被放逐的物质似乎从本宇宙中被彻底移除。\n\nMAS-015 当前尚未被物理收容。其移动模式和行为动机完全未知。","containment_procedures":"MAS-015 尚未被有效收容。当前的”收容措施“实质上是一套监测和应急响应协议。\n\n全球部署的”虚空哨兵“监测网络持续追踪异常空间扭曲信号。检测到疑似放逐事件时，区域内所有协会资产须在██分钟内完成疏散。\n\n放逐事件发生后，快速反应部队”遗忘者“须在30分钟内抵达现场执行信息封锁和目击者A级记忆删除。\n\n对MAS-015的主动研究须在远程进行。提议中的”维度诱饵“和”空间锚定“方案正在接受O5议会评估。\n\n若在协会设施内检测到放逐事件前兆，须立即启动协议”空洞“，激活全站空间稳定器。","created_at":"2026-07-15T00:00:00Z","updated_at":"2026-07-15T00:00:00Z"},
  "16":{"id":16,"item_number":"MAS-016","title":"共感菌株","class":"Euclid","description":"MAS-016 是一种存在于空气中的微生物菌株，肉眼不可见，直径为2-5微米。该菌株的异常效应体现在其能够建立人类之间的”情感共感网络“。\n\n当两个及以上人类个体同时暴露在含有MAS-016的环境中超过1小时，这些个体之间将建立一种非语言的共感连接。处于连接中的个体可以模糊感知到其他连接者的情绪状态（快乐、悲伤、恐惧、愤怒等），但不能得知引发该情绪的具体原因。\n\n共感连接的强度随个体之间的距离增加而减弱，但从未完全消失。记录中最远的共感连接距离为地球至国际空间站（约408公里），连接强度约为近距离的██%。\n\n该共感效应给协会的安保工作带来了新的挑战。██/██/20██，正在被收容的某个异常实体的研究团队通过MAS-016建立的共感网络，无意间将恐惧情绪传递给了数公里外的普通平民，导致了██起恐慌事件。","containment_procedures":"由MAS-016共感效应引发的突发事件应被记录为”情感溢出事件“。\n\n研究人员可通过定期心理筛查和情绪管理培训降低共感溢出风险。\n\n建议在Site-17的公共区域安装空气过滤系统以降低MAS-016浓度。\n\nMAS-016 的利用方案（包括大规模情感同步、远程心理战防御）仍在评估中。所有涉及该菌株的实验须在密闭环境中进行，实验人员须佩戴独立的空气供应设备。","created_at":"2026-07-16T00:00:00Z","updated_at":"2026-07-16T00:00:00Z"},
  "17":{"id":17,"item_number":"MAS-017","title":"归零方程式","class":"Thaumiel","description":"MAS-017 是一个由未知数学家或超自然实体推导出的数学公式，当前记录在██张手写稿纸上。该公式本身具有异常效应：当任何具备高等数学知识的个体完整阅读并理解该公式后，该个体将获得”归零“任意物理或异常效应的能力。\n\n”归零“操作的具体效果是使目标恢复到其数学上的”初始状态“。例如：\n- 对被MAS-001遗忘记忆的个体使用，可恢复其失去的记忆\n- 对被其他异常项目物理改变的物体使用，可将其恢复至改变前的形态\n- 理论上，对MAS-006（终灭之种）的分解效应使用，可逆转分解过程\n\n但每次使用”归零“能力都会对使用者造成不可逆的生理损伤。累计使用██次后，使用者将出现”存在衰减“现象——其身体从微观层面开始不稳定，最终在数周内完全消散为基本粒子。\n\n目前确认完整理解MAS-017的个体仅剩█人。公式本身的某些部分使用了非欧几里得几何进行表述，导致即使是最顶尖的数学家在尝试理解时也会出现严重认知偏差。","containment_procedures":"MAS-017 的原件保存于Site-01的零级保险库中。数字化副本已加密并分散存储在三处不同地理位置的服务器中。\n\n访问原件须获得O5议会至少3名成员的同时批准。访问后须接受强制性记忆抑制处理。\n\n已知的公式理解者须每48小时进行一次”存在稳定性检测“。若检测到衰减前兆，须立即中止其所有”归零“操作权限。\n\nMAS-017 是处置多个Apollyon级项目的后备方案之一。其使用优先级由O5议会审慎决定。","created_at":"2026-07-17T00:00:00Z","updated_at":"2026-07-17T00:00:00Z"},
  "18":{"id":18,"item_number":"MAS-018","title":"低语者","class":"Keter","description":"MAS-018 是一个仅通过听觉感知的异常存在。受影响者会听到持续的低语声，声源似乎来自听者自身的颅内。低语内容因听者的母语和文化背景而异，但总是以极具说服力的方式诱导听者执行某种行为。\n\n记录到的诱导行为包括：自残、攻击他人、盗窃、纵火、████以及██████。受影响者在执行这些行为时表现出一种”被解放“的精神状态，事后通常无法解释自己的动机。\n\nMAS-018 的传播方式已被确认：当受影响个体（称为”传播者“）与非受影响个体进行超过██秒的眼神接触时，后者即被感染。感染后的潜伏期为3-7天，在此期间感染者不会听到低语，但已具备传播能力。\n\n当前估计全球已有约██万名感染者。由于传播方式相对可控（避免眼神接触），大规模爆发尚未发生。\n\n抗精神类药物可暂时抑制低语的音量但无法根除。唯一有效的根除方法是通过████程序进行神经重置，但该程序有██%的概率导致永久性听力丧失。","containment_procedures":"确认MAS-018感染者后，须立即进行隔离。感染者须佩戴不透明眼罩（防止传播）和降噪耳机（缓解低语影响）。\n\n所有协会人员须强制接受每周MAS-018检测。检测阳性者须立即停职并转入治疗程序。\n\n全球公共卫生系统已植入”新型视觉障碍传染病“的虚假信息以解释眼罩佩戴建议。\n\n████程序仅对感染超过██天的个体有效。早期感染者须通过心理辅导和行为监控进行管理。\n\n研究部门正全力开发MAS-018的疫苗。当前进展：[数据删除]","created_at":"2026-07-18T00:00:00Z","updated_at":"2026-07-18T00:00:00Z"},
  "19":{"id":19,"item_number":"MAS-019","title":"星桥","class":"Safe","description":"MAS-019 是位于南太平洋██岛上的一个石门建筑，由三块未经雕琢的玄武岩构成，推测建造于███年前。每年仅在冬至日（12月21日至22日）的日出时分，阳光穿过石门时，门框内会短暂（约3.7秒）显现出一个直指夜空的发光路径，该路径指向的是当前用最先进望远镜也无法观测到的一个天区。\n\n光谱分析显示该发光路径所指向的位置存在强烈的异常能量信号，但由于距离过于遥远（推算至少████光年），目前无法进行实地探测。\n\n古人似乎知晓该建筑的功能。岛上发现了██块刻有星图的石碑，其中一块描绘了一个与当代天文学认知完全不符的星系结构。\n\nMAS-019 每年仅有一次激活窗口，错过了须再等一年。██次激活事件中，有██次观测到了微弱的”回应信号“——石门上出现了短暂的发光符号，符号内容至今未能破译。","containment_procedures":"██岛已被列为军事禁区，对外声称为”导弹试验靶场“。岛上所有原住民已于最初的发现阶段被重新安置。\n\n每年冬至前后72小时，研究团队须在岛上待命。观测设备须在激活窗口前24小时部署完毕。\n\n任何非协会船只进入██岛50海里范围将被武装巡逻艇截停和遣返。拒绝配合者适用标准武力升级程序。\n\n所有激活事件的观测数据须在24小时内加密传输至Site-01。严禁通过非加密信道讨论或传输MAS-019相关数据。","created_at":"2026-07-19T00:00:00Z","updated_at":"2026-07-19T00:00:00Z"},
  "20":{"id":20,"item_number":"MAS-020","title":"末路之书","class":"Apollyon","description":"MAS-020 是一本A4大小的笔记本，封面为普通硬纸板，内页约200页。打开时可见其中正以恒定的速度自动书写着文字（每页约需1小时写满）。书写内容为工整的手写体英文。\n\n经过分析，该笔记本正在自动记录的是”所有被MAS协会收容的异常项目在未来███年的完整历史“。目前已记录的███页中，包含了对██个尚未被发现的异常项目的详细描述和收容建议。\n\n其中第██页完整记录了MAS-███的性质——该项目的发现日期标记为██/██/20██（距今还有██年）。预知信息的准确性已在多个案例中得到验证。\n\n然而，第███页的内容引发了O5议会的紧急闭门会议。该页仅写了一句话：”[数据在O5指令MAS-020-OMEGA下被删除]“。会议后MAS-020的安保等级从Thaumiel调整为Apollyon。\n\n当前该笔记本仍在持续书写。剩余的空白页预计在██年内将全部写满。","containment_procedures":"MAS-020 须保存在Site-01的零级保险库中，仅O5议会成员有访问权限。\n\n每24小时须由指定O5成员（轮值制）查阅新书写的页面，评估其中信息对协会安全的影响。\n\n禁止任何低于5级的人员阅读MAS-020的内容。违反者将被立即执行A级记忆删除并降级处理。\n\n若MAS-020预测了XK级（末日级）事件，须立即召集O5全体会议。","created_at":"2026-07-20T00:00:00Z","updated_at":"2026-07-20T00:00:00Z"}
};
