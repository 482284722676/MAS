<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>档案管理 - MAS 管理后台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="./" class="navbar-brand">MAS<span>管理后台</span></a>
  </div>
</nav>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-title">导航</div>
    <a href="dashboard.html">仪表盘</a>
    <a href="manage.html" class="active">档案管理</a>
    <a href="review.html">档案审核</a>
    <a href="suggestions.html">意见建议</a>
    <a href="../index.html" target="_blank" style="margin-top:auto;">返回前台</a>
  </aside>

  <main class="admin-content">
    <div class="admin-header">
      <h1>档案管理</h1>
      <div style="display:flex;gap:12px;">
        <a href="edit.html" class="btn btn-primary">+ 新建项目</a>
        <button class="admin-logout" onclick="logout()">退出登录</button>
      </div>
    </div>

    <table class="admin-table" id="anomalyTable">
      <thead>
        <tr>
          <th>编号</th>
          <th>标题</th>
          <th>等级</th>
          <th>更新时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="5"><div class="loading">加载中...</div></td></tr>
      </tbody>
    </table>

    <div class="pagination" id="pagination"></div>
  </main>
</div>

<script src="js/particles.js"></script>
<script src="../js/api.js"></script>
<script>
(function() {
  var token = localStorage.getItem('mas_token');
  if (!token) { window.location.href = 'login.html'; return; }

  verifyToken().catch(function() { window.location.href = 'login.html'; });

  window.logout = function() {
    localStorage.removeItem('mas_token');
    window.location.href = 'login.html';
  };

  var currentPage = 1;

  function loadAnomalies() {
    var tbody = document.getElementById('tableBody');
    tbody.innerHTML = '<tr><td colspan="5"><div class="loading">加载中...</div></td></tr>';

    adminGetAnomalies({ page: currentPage, limit: 15 }).then(function(data) {
      if (data.items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5"><div class="empty">暂无档案数据</div></td></tr>';
        return;
      }
      tbody.innerHTML = data.items.map(function(item) {
        return '<tr>' +
          '<td style="font-family:var(--font-mono);font-size:12px;">' + item.item_number + '</td>' +
          '<td>' + item.title + '</td>' +
          '<td><span class="class-badge ' + item.class + '">' + item.class + '</span></td>' +
          '<td style="font-size:12px;color:var(--text-muted);">' + formatDate(item.updated_at) + '</td>' +
          '<td>' +
            '<div class="actions">' +
              '<a href="edit.html?id=' + item.id + '" class="btn btn-sm">编辑</a>' +
              '<button class="btn btn-sm btn-danger" onclick="deleteItem(' + item.id + ', \'' + item.item_number + '\')">删除</button>' +
            '</div>' +
          '</td>' +
        '</tr>';
      }).join('');

      renderPagination(data.totalPages);
    }).catch(function(err) {
      tbody.innerHTML = '<tr><td colspan="5"><div class="empty">加载失败: ' + err.message + '</div></td></tr>';
    });
  }

  function renderPagination(totalPages) {
    var html = '';
    html += '<button ' + (currentPage <= 1 ? 'disabled' : '') + ' onclick="changePage(' + (currentPage - 1) + ')">上一页</button>';
    for (var i = 1; i <= totalPages; i++) {
      if (totalPages > 7 && i > 3 && i < totalPages - 2 && i !== currentPage) {
        if (i === 4) html += '<span style="padding:8px;color:var(--text-muted);">...</span>';
        continue;
      }
      html += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="changePage(' + i + ')">' + i + '</button>';
    }
    html += '<button ' + (currentPage >= totalPages ? 'disabled' : '') + ' onclick="changePage(' + (currentPage + 1) + ')">下一页</button>';
    document.getElementById('pagination').innerHTML = html;
  }

  window.changePage = function(page) {
    currentPage = page;
    loadAnomalies();
  };

  window.deleteItem = function(id, itemNumber) {
    if (!confirm('确认删除 ' + itemNumber + ' 吗？此操作不可撤销。')) return;
    deleteAnomaly(id).then(function() {
      showToast(itemNumber + ' 已删除');
      loadAnomalies();
    }).catch(function(err) {
      showToast(err.message, 'error');
    });
  };

  loadAnomalies();
})();
</script>
</body>
</html>
