<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAS - 异常管理与安全组织</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="./" class="navbar-brand">MAS<span>协会</span></a>
    <button class="navbar-toggle" id="navbarToggle" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
    <ul class="navbar-links" id="navbarLinks">
      <li><a href="./" class="active">首页</a></li>
      <li><a href="anomalies.html" target="_blank">异常档案</a></li>
      <li><a href="submit.html" target="_blank">提交档案</a></li>
      <li><a href="about.html">关于</a></li>
      <li><a href="report.html">意见建议</a></li>
      <li><a href="admin/login.html" target="_blank">管理入口</a></li>
    </ul>
  </div>
</nav>

<section class="hero">
  <div class="container">
    <div class="hero-logo">MAS</div>
    <div class="hero-subtitle">Malignance Administration & Security</div>
    <p class="hero-desc">
      我们收容异常，保护常态。
      MAS协会致力于识别、收容与研究全球范围内的异常项目，
      确保人类文明的安全与延续。
    </p>
    <a href="anomalies.html" class="btn" target="_blank">查阅异常档案</a>
  </div>
</section>

<section class="section">
  <div class="container">
    <h2 class="section-title">等级体系</h2>
    <p class="section-subtitle">异常项目依其收容难度与危险程度分为六个等级</p>
    <div class="anomaly-grid" id="classGrid"></div>
  </div>
</section>

<section class="section">
  <div class="container">
    <h2 class="section-title">近期档案</h2>
    <p class="section-subtitle">最新入库的异常项目档案</p>
    <div class="anomaly-grid" id="recentGrid"></div>
    <div style="text-align:center;margin-top:32px;">
      <a href="anomalies.html" class="btn">查看全部档案</a>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <p class="footer-text">MAS FOUNDATION &copy; 2026 | 本网站内容仅供授权人员查阅</p>
    <p class="footer-text" style="margin-top:4px;">未经授权访问将受到法律追究</p>
  </div>
</footer>

<script src="js/particles.js"></script>
<script src="js/api.js"></script>
<script>
(function() {
  document.getElementById('navbarToggle').addEventListener('click', function() {
    this.classList.toggle('open');
    document.getElementById('navbarLinks').classList.toggle('open');
  });
})();
(function() {
  var classes = [
    { name: 'Safe', desc: '易于安全收容的异常项目', color: 'var(--safe)' },
    { name: 'Euclid', desc: '需要更多资源收容的异常项目', color: 'var(--euclid)' },
    { name: 'Keter', desc: '极难持续安全收容的异常项目', color: 'var(--keter)' },
    { name: 'Thaumiel', desc: '用于收容其他异常的辅助项目', color: 'var(--thaumiel)' },
    { name: 'Apollyon', desc: '无法收容的世界级威胁', color: 'var(--apollyon)' },
    { name: 'Neutralized', desc: '已被摧毁或失去异常特性', color: 'var(--neutralized)' }
  ];

  var classGrid = document.getElementById('classGrid');
  classes.forEach(function(cls) {
    var card = document.createElement('div');
    card.className = 'anomaly-card';
    card.style.borderLeft = '3px solid ' + cls.color;
    card.innerHTML =
      '<span class="class-badge ' + cls.name + '">' + cls.name + '</span>' +
      '<h3 style="font-family:var(--font-mono);font-size:16px;margin-top:12px;margin-bottom:8px;">' + cls.name + ' 级</h3>' +
      '<p style="font-size:13px;color:var(--text-secondary);">' + cls.desc + '</p>';
    card.onclick = function() { window.location.href = 'anomalies.html?class=' + cls.name; };
    classGrid.appendChild(card);
  });

  getAnomalies({ limit: 6, page: 1 }).then(function(data) {
    var grid = document.getElementById('recentGrid');
    if (data.items.length === 0) {
      grid.innerHTML = '<div class="empty">暂无档案</div>';
      return;
    }
    data.items.forEach(function(item) {
      var card = document.createElement('div');
      card.className = 'anomaly-card';
      card.innerHTML =
        '<div class="anomaly-card-header">' +
          '<span class="anomaly-card-id">' + item.item_number + '</span>' +
          '<span class="class-badge ' + item.class + '">' + item.class + '</span>' +
        '</div>' +
        '<div class="anomaly-card-title">' + item.title + '</div>' +
        '<div class="anomaly-card-desc">' + (item.description || '').replace(/\n/g, ' ').substring(0, 120) + '...</div>';
      card.onclick = function() { window.location.href = 'detail.html?id=' + item.id; };
      grid.appendChild(card);
    });
  }).catch(function() {
    document.getElementById('recentGrid').innerHTML = '<div class="empty">加载失败</div>';
  });
})();
</script>
</body>
</html>
